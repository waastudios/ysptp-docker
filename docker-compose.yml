services:
  ysp-live:
    image: ysp-live:9.0
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ysp-live-v9.0
    restart: unless-stopped
    ports:
      - "8767:8767"
    volumes:
      - ./data:/app/data
    environment:
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
      - YSP_DATA_DIR=/app/data
